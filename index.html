<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@Kaboom</title>

  <!-- Fonts: Inter for UI, JetBrains Mono for techy accents -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- Ambient Background Glow -->
  <div class="ambient-glow"></div>

  <main class="card">
    
    <!-- TOP BAR: Avatar & Theme Toggle -->
    <header class="top-bar">
      <div class="avatar-container">
        <!-- Using a DiceBear avatar as a placeholder, you can replace the src with your own image URL -->
        <img src="https://api.dicebear.com/9.x/glass/svg?seed=Kaboom" alt="Avatar" class="avatar" id="avatar">
        <span class="status-indicator" id="discord-status-indicator"></span>
      </div>
      
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
        <i class="fa-solid fa-moon"></i>
      </button>
    </header>

    <!-- IDENTITY -->
    <section class="identity">
      <h1 class="name">@Kaboom <i class="fa-solid fa-check-circle verified-badge"></i></h1>
      <p class="tagline">AI Dev &bull; Gamer</p>
    </section>

    <!-- NOW PLAYING (Premium Status Card) -->
    <section class="now-playing" id="now-playing-card">
      <div class="now-playing-header">
        <span class="live-dot"></span>
        <span>Currently Playing</span>
      </div>
      <div id="presence-content" class="presence-body">
        <p class="placeholder-text">Connecting to Discord...</p>
      </div>
    </section>

    <!-- PC SPECS (Minimalist List) -->
    <section class="specs">
      <h2 class="section-title">System Specs</h2>
      <ul class="specs-list">
        <li><span class="spec-label">CPU</span> <span class="spec-value">Ryzen 3 2200G</span></li>
        <li><span class="spec-label">GPU</span> <span class="spec-value">Radeon Vega 8</span></li>
        <li><span class="spec-label">RAM</span> <span class="spec-value">8GB DDR4</span></li>
      </ul>
    </section>

    <!-- SOCIALS (Full-width interactive rows) -->
    <section class="socials">
      <a href="https://discord.com/users/YOUR_DISCORD_ID_HERE" target="_blank" rel="noopener" class="social-btn discord">
        <i class="fa-brands fa-discord"></i>
        <span>mr_kaboom86</span>
        <i class="fa-solid fa-arrow-right arrow-icon"></i>
      </a>
      <a href="https://github.com/Mrkaboom27" target="_blank" rel="noopener" class="social-btn github">
        <i class="fa-brands fa-github"></i>
        <span>Mrkaboom27</span>
        <i class="fa-solid fa-arrow-right arrow-icon"></i>
      </a>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <span class="mono">&copy; 2026 Kaboom</span>
    </footer>

  </main>

  <script src="./script.js"></script>
</body>
</html>
